<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Hein Sitt Tun — Associate DevOps Engineer</title>
  <desc id="bannerDesc">Dark hero banner: name, role, and focus areas alongside a cluster-topology motif representing infrastructure nodes and links.</desc>

  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1120"/>
      <stop offset="0.52" stop-color="#0C1626"/>
      <stop offset="1" stop-color="#0A101C"/>
    </linearGradient>

    <radialGradient id="glowDark" cx="0.78" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0A1120" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edgeDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="0.72" stop-color="#818CF8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>

    <pattern id="gridDark" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8FA9C4" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <filter id="softDark" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="16" fill="url(#bgDark)"/>
  <rect width="1000" height="260" rx="16" fill="url(#gridDark)"/>
  <rect width="1000" height="260" rx="16" fill="url(#glowDark)"/>

  <!-- ── Cluster topology motif ─────────────────────────────────────── -->
  <g stroke="#22D3EE" stroke-opacity="0.22" fill="none" stroke-width="1">
    <circle cx="812" cy="128" r="86"/>
    <circle cx="812" cy="128" r="126"/>
  </g>

  <g stroke="#38BDF8" stroke-opacity="0.34" stroke-width="1.1" fill="none">
    <path d="M672 108 L764 78"/>
    <path d="M672 108 L790 148"/>
    <path d="M764 78 L872 106"/>
    <path d="M790 148 L872 106"/>
    <path d="M790 148 L826 196"/>
    <path d="M872 106 L930 158"/>
    <path d="M826 196 L930 158"/>
    <path d="M764 78 L826 196" stroke-opacity="0.16"/>
  </g>

  <g fill="#22D3EE">
    <circle cx="672" cy="108" r="4.5"/>
    <circle cx="764" cy="78" r="3.5" fill="#818CF8"/>
    <circle cx="790" cy="148" r="4"/>
    <circle cx="826" cy="196" r="3.2" fill="#818CF8"/>
    <circle cx="872" cy="106" r="5" filter="url(#softDark)"/>
    <circle cx="930" cy="158" r="3.5" fill="#818CF8"/>
  </g>

  <!-- Node pulse -->
  <circle cx="872" cy="106" r="5" fill="none" stroke="#22D3EE" stroke-width="1.2">
    <animate attributeName="r" values="5;17;5" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.55;0;0.55" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <!-- ── Identity block ────────────────────────────────────────────── -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, Helvetica, sans-serif">
    <text x="56" y="84" fill="#22D3EE" font-size="11.5" font-weight="600" letter-spacing="3.4">ASSOCIATE DEVOPS ENGINEER</text>

    <text x="56" y="139" fill="#F1F5F9" font-size="45" font-weight="700" letter-spacing="-0.6">Hein Sitt Tun</text>

    <rect x="56" y="154" width="52" height="3" rx="1.5" fill="#22D3EE"/>
    <rect x="112" y="154" width="22" height="3" rx="1.5" fill="#818CF8" opacity="0.75"/>

    <text x="56" y="190" fill="#A9B8CB" font-size="14.5" letter-spacing="0.2">Cloud &amp; Automation · Infrastructure as Code · Observability</text>

    <text x="56" y="217" fill="#6E8098" font-size="12.5" letter-spacing="0.4">Yangon, Myanmar · BIM ATS</text>
  </g>

  <!-- Hairline accent along the bottom edge -->
  <rect x="0" y="258" width="1000" height="2" fill="url(#edgeDark)"/>
</svg>
