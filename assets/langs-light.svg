    <text x="366.7" y="154.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5A6472">32.7%</text>
    <circle cx="658.3" cy="142.0" r="5" fill="#663399"/>
    <text x="673.3" y="138.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0B0D12">CSS</text>
