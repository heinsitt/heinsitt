    <text x="60.0" y="194.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5A6472">2.2%</text>
    <circle cx="351.7" cy="182.0" r="5" fill="#8A94A2"/>
    <text x="366.7" y="178.0" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0B0D12">Other</text>
