<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="212" viewBox="0 0 1000 212" role="img" aria-labelledby="lt ld">
  <title id="lt">Language breakdown — TypeScript 56.7%, HTML 32.7%, CSS 8.2%, JavaScript 2.2%, Other 0.1%</title>
  <desc id="ld">Byte-weighted language distribution across Hein Sitt's public repositories.</desc>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F2F4F7"/>
      <stop offset="100%" stop-color="#E7EBF0"/>
    </linearGradient>
    <pattern id="lgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0B0D12" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="lsheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B0D12" stop-opacity="0"/>
      <stop offset=".5" stop-color="#0B0D12" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0B0D12" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lhead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B32020" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#B32020" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#B32020" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lbar"><rect x="40" y="74" width="920" height="16" rx="8"/></clipPath>
    <clipPath id="lcard"><rect width="1000" height="212" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#lcard)">
    <rect width="1000" height="212" fill="url(#lbg)"/>
    <rect width="1000" height="212" fill="url(#lgrid)"/>
    <path d="M30 26 V18 H38 M970 26 V18 H962 M30 186 V194 H38 M970 186 V194 H962" fill="none" stroke="#B32020" stroke-opacity="0.55" stroke-width="1.4"/>

    <text x="40" y="46" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" letter-spacing="0.2" fill="#0B0D12">Language breakdown</text>
    <text x="960" y="46" text-anchor="end" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#5A6472">18 public repositories   ·   1.4 MB   ·   GitHub Linguist</text>
    <rect x="40" y="57" width="920" height="1" fill="url(#lhead)"/>

    <rect x="40" y="74" width="920" height="16" rx="8" fill="#D5DBE3"/>
    <g clip-path="url(#lbar)">
