<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="340" viewBox="0 0 1200 340" role="img"
     aria-labelledby="title desc">
  <title id="title">Hein Sitt Tun — Cyan Matrix Digital Rain</title>
  <desc id="desc">A dark navy cyber-inspired banner with animated cyan and violet digital rain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060B14"/>
      <stop offset="0.55" stop-color="#0A1424"/>
      <stop offset="1" stop-color="#090D1B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#12344A" stop-opacity=".72"/>
      <stop offset=".58" stop-color="#0A1728" stop-opacity=".3"/>
      <stop offset="1" stop-color="#080D18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".18" stop-color="#22D3EE" stop-opacity=".42"/>
      <stop offset=".78" stop-color="#22D3EE" stop-opacity=".82"/>
      <stop offset="1" stop-color="#A5F3FC" stop-opacity="1"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#5B7894" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <g id="stream" font-family="monospace" font-size="15" font-weight="600" fill="#22D3EE">
      <text x="0" y="0">01</text><text x="0" y="19">⌁</text><text x="0" y="38">10</text>
      <text x="0" y="57">∷</text><text x="0" y="76">11</text><text x="0" y="95">⌘</text>
      <text x="0" y="114">01</text><text x="0" y="133">∴</text><text x="0" y="152">10</text>
      <text x="0" y="171">⌁</text><text x="0" y="190">11</text><text x="0" y="209">01</text>
      <text x="0" y="228">∷</text><text x="0" y="247">10</text><text x="0" y="266">⌘</text>
    </g>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow)"/>

  <!-- Animated digital-rain columns -->
  <g opacity=".48">
    <use xlink:href="#stream" x="36" y="-260"><animate attributeName="y" values="-260;350" dur="8s" repeatCount="indefinite"/></use>
    <use xlink:href="#stream" x="104" y="-80" opacity=".55"><animate attributeName="y" values="-80;370" dur="10s" repeatCount="indefinite"/></use>
    <use xlink:href="#stream" x="178" y="-330" opacity=".7"><animate attributeName="y" values="-330;360" dur="9s" repeatCount="indefinite"/></use>
    <use xlink:href="#stream" x="268" y="-150" opacity=".45"><animate attributeName="y" values="-150;370" dur="11s" repeatCount="indefinite"/></use>
    <use xlink:href="#stream" x="368" y="-290" opacity=".38"><animate attributeName="y" values="-290;350" dur="8.8s" repeatCount="indefinite"/></use>
    <use xlink:href="#stream" x="480" y="-180" opacity=".34"><animate attributeName="y" values="-180;370" dur="10.5s" repeatCount="indefinite"/></use>
    <use xlink:href="#stream" x="720" y="-300" opacity=".35"><animate attributeName="y" values="-300;360" dur="9.6s" repeatCount="indefinite"/></use>
    <use xlink:href="#stream" x="830" y="-120" opacity=".45"><animate attributeName="y" values="-120;370" dur="8.4s" repeatCount="indefinite"/></use>
    <use xlink:href="#stream" x="930" y="-350" opacity=".65"><animate attributeName="y" values="-350;370" dur="10.8s" repeatCount="indefinite"/></use>
    <use xlink:href="#stream" x="1030" y="-210" opacity=".5"><animate attributeName="y" values="-210;370" dur="9.2s" repeatCount="indefinite"/></use>
    <use xlink:href="#stream" x="1140" y="-270" opacity=".6"><animate attributeName="y" values="-270;370" dur="11.2s" repeatCount="indefinite"/></use>
  </g>
  <g fill="#A78BFA" opacity=".5" font-family="monospace" font-size="13">
    <text x="222" y="30">0101</text><text x="930" y="292">1010</text>
    <text x="1080" y="70">010</text><text x="65" y="290">1101</text>
  </g>

  <!-- Central readability veil -->
  <rect x="300" y="82" width="600" height="178" rx="20"
        fill="#07111F" fill-opacity=".76" stroke="#22D3EE" stroke-opacity=".25"/>
  <rect x="316" y="98" width="568" height="146" rx="14"
        fill="none" stroke="#8B5CF6" stroke-opacity=".18"/>

  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif">
    <text x="600" y="151" fill="#F1F5F9" font-size="42" font-weight="700"
          letter-spacing="2" filter="url(#softGlow)">HEIN SITT TUN</text>
    <text x="600" y="185" fill="#22D3EE" font-size="17" font-weight="600"
          letter-spacing="4">ASSOCIATE DEVOPS ENGINEER</text>
    <text x="600" y="216" fill="#B7C5D6" font-size="13"
          letter-spacing="2">CLOUD  /  AUTOMATION  /  OBSERVABILITY</text>
  </g>

  <!-- Accent line with animated highlight -->
  <rect x="470" y="232" width="260" height="2" rx="1" fill="#22D3EE" opacity=".28"/>
  <rect x="470" y="232" width="62" height="2" rx="1" fill="#A5F3FC" filter="url(#softGlow)">
    <animate attributeName="x" values="470;668;470" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <path d="M20 22h34M20 22v34M1180 22h-34M1180 22v34M20 318h34M20 318v-34M1180 318h-34M1180 318v-34"
        fill="none" stroke="#22D3EE" stroke-opacity=".6" stroke-width="2"/>
  <circle cx="600" cy="42" r="2.5" fill="#22D3EE" filter="url(#softGlow)"/>
</svg>
